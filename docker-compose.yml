services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: lower_db
    environment:
      POSTGRES_USER: lower_user
      POSTGRES_PASSWORD: lowerpassword
      POSTGRES_DB: lower_db
    ports:
      - "5015:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      -c shared_buffers=1024MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lower_user -d lower_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:  # Changed from 'postgres' to 'postgres_data'