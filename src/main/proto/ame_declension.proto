syntax = "proto3";

package namedeclension;

option java_package = "org.lower.document.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "NameDeclensionProto";

service NameDeclensionService {
  rpc DeclineFullName (DeclineFullNameRequest) returns (DeclineFullNameResponse);
}

enum Gender {
  GENDER_UNKNOWN = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message DeclineFullNameRequest {
  string last_name = 1;
  string first_name = 2;
  string middle_name = 3;
  Gender gender = 4;
}

message CaseForms {
  string nominative = 1;
  string genitive = 2;
  string dative = 3;
  string accusative = 4;
  string instrumental = 5;
  string prepositional = 6;
}

message DeclinedName {
  CaseForms cases = 1;
  string confidence = 2;
}

message DeclineFullNameResponse {
  DeclinedName last_name = 1;
  DeclinedName first_name = 2;
  DeclinedName middle_name = 3;
  Gender detected_gender = 4;
}